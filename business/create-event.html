<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Peak Business</title>
    <link rel="stylesheet" href="business.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="business-page dark-theme">
    <header class="dashboard-header">
        <div class="container">
            <a href="dashboard.html" class="logo-placeholder">
                <div class="logo-circle"><i class="fas fa-mountain"></i></div>
                <span class="logo-text">PEAK</span>
            </a>
            <a href="dashboard.html" class="btn-ghost"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>
    </header>

    <main class="create-event-main container">
        <h1>Create event</h1>

        <div id="step-venue" class="create-step">
            <h2>Select a venue</h2>
            <p class="step-desc">Choose from the venues in our network.</p>
            <div class="venues-grid" id="venues-grid">
                <p class="loading" id="venues-loading">Loading venues…</p>
                <p class="error" id="venues-error" style="display:none;"></p>
            </div>
        </div>

        <form id="event-form" class="create-step" style="display:none;">
            <h2>Event details</h2>
            <input type="hidden" id="venue-id" name="venueId">
            <input type="hidden" id="venue-name" name="venueName">
            <input type="hidden" id="venue-image" name="venueImage">
            <input type="hidden" id="venue-addr" name="addr">

            <div class="selected-venue" id="selected-venue"></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="event-date">Date</label>
                    <input type="date" id="event-date" name="date" required>
                </div>
            </div>
            <div class="form-row two-cols">
                <div class="form-group">
                    <label for="price-girls">Price per ticket (girls) $</label>
                    <input type="number" id="price-girls" name="priceGirls" min="0" step="0.01" value="0" required>
                </div>
                <div class="form-group">
                    <label for="price-boys">Price per ticket (boys) $</label>
                    <input type="number" id="price-boys" name="priceBoys" min="0" step="0.01" value="0" required>
                </div>
            </div>
            <p id="create-error" class="form-error" style="display:none;"></p>
            <div class="form-actions">
                <button type="button" id="btn-back-venue" class="btn-ghost">Back to venues</button>
                <button type="submit" class="btn-primary">Create event</button>
            </div>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="firebase-auth.js"></script>
    <script src="firebase-db.js"></script>
    <script src="create-event.js"></script>
</body>
</html>
