<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login | Peak NYU</title>
    <link rel="stylesheet" href="business.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="business-page dark-theme">
    <div class="auth-container">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Peak</a>
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-placeholder">
                    <div class="logo-circle"><i class="fas fa-mountain"></i></div>
                    <span class="logo-text">PEAK</span>
                </div>
                <h1>For Businesses</h1>
                <p class="auth-subtitle">Create an account or sign in to manage your events</p>
            </div>

            <div id="auth-tabs" class="auth-tabs">
                <button type="button" class="tab active" data-tab="signin">Log in</button>
                <button type="button" class="tab" data-tab="signup">Create account</button>
            </div>

            <form id="signin-form" class="auth-form active">
                <div class="form-group">
                    <label for="signin-email">Email</label>
                    <input type="email" id="signin-email" required placeholder="you@venue.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <p id="signin-error" class="form-error" aria-live="polite"></p>
                <button type="submit" class="btn-primary">Log in</button>
            </form>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required placeholder="you@venue.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="At least 6 characters" autocomplete="new-password" minlength="6">
                </div>
                <p id="signup-error" class="form-error" aria-live="polite"></p>
                <button type="submit" class="btn-primary">Create account</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="firebase-auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
